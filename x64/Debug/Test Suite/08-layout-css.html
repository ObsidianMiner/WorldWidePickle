<!DOCTYPE html>
<html>
  <head>
    <style>
      .box {
        border: 2px solid black;
        margin: 10px;
        padding: 10px;
      }
      .inline {
        display: inline;
        border: 1px dashed red;
      }
    </style>
  </head>
  <body>
    <div class="box">Block box</div>
    <span class="inline">Inline A</span>
    <span class="inline">Inline B</span>
  </body>
</html>
