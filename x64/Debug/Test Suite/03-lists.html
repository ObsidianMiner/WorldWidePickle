<!DOCTYPE html>
<html>
  <body>
    <h2>Unordered List</h2>
    <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Cherry</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
      <li>First</li>
      <li>Second</li>
      <li>
        Third
        <ul>
          <li>Nested A</li>
          <li>Nested B</li>
        </ul>
      </li>
    </ol>
  </body>
</html>
